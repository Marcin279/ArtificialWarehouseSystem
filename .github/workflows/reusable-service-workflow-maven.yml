# Plik: .github/workflows/reusable-service-workflow-maven.yml

name: Reusable Service CI/CD (Maven)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Użycie cache'u Maven

      # 1. Budowanie i Testowanie tylko zmienionego modułu
      # -pl (projects): Określa, który moduł budować
      # -am (also make): Zapewnia, że zależności modułu (np. wspólne biblioteki) zostaną zbudowane
      - name: Build and Test Module 🛠️
        # Używamy lifecycle 'package', który uruchamia testy i tworzy plik JAR
        run: mvn install --projects ${{ inputs.service_name }} --also-make -DskipTests=false

      # Upload zbudowanego JAR jako artifact dla kolejnego joba
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name }}-jar
          path: ${{ inputs.service_name }}/target/*.jar
          retention-days: 1

  docker_build_and_push:
    needs: [ build_and_test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Download zbudowanego JAR z poprzedniego joba
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service_name }}-jar
          path: ${{ inputs.service_name }}/target/

      # Autoryzacja do GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Budowanie i push do GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service_name }} # Katalog serwisu jako kontekst
          file: ./${{ inputs.service_name }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ github.sha }}

  deploy:
    needs: [ docker_build_and_push ]
    runs-on: ubuntu-latest
    environment: Production # Użyj środowisk dla kontroli dostępu
    steps:
      # 3. Wdrożenie na Kubernetes/Infrastrukturę
      - name: Deploy to Infrastructure
        # W tym miejscu wywołasz wdrożenie (np. Helm/kubectl)
        # Zintegrowane narzędzia do migracji bazy danych (Flyway/Liquibase)
        # uruchomią migracje schematu PostgreSQL podczas startu serwisu.
        run: echo "Deploying ${{ inputs.service_name }}"