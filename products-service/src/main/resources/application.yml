grpc:
  server:
    port: 9095
    max-inbound-message-size: 20971520  # 20MB
    max-outbound-message-size: 20971520  # 20M

spring:
  application:
    name: products-service
  datasource:
    url: jdbc:postgresql://postgres-products:5432/products_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "prometheus"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true